version: 2
updates:
  # Keep the pinned action SHAs current. Dependabot updates the SHA and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  # Security fixes only. Version bumps are deliberately off (limit 0): any
  # runtime dependency change needs `npm run build` and a committed dist/,
  # which Dependabot cannot do, so routine bumps would just fail the drift check.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies]
