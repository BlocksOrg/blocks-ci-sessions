name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to point the floating major tag at (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  major-tag:
    name: Move the floating major tag
    # A pre-release must never become what `@v1` resolves to.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # `uses: BlocksOrg/blocks-ci-sessions@v1` resolves through a floating major
      # tag, so every release has to drag it forward.
      - name: Retarget the major tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a vMAJOR.MINOR.PATCH tag, got '$RELEASE_TAG'."
            exit 1
          fi
          MAJOR="v${BASH_REMATCH[1]}"
          # Only ever point the floating tag at something that went through
          # main's review and required checks.
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "::error::$RELEASE_TAG is not on main; refusing to move $MAJOR to it."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f "$MAJOR" "$RELEASE_TAG"
          git push --force origin "refs/tags/$MAJOR"
          echo "$MAJOR now points at $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
