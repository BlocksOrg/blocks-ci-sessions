name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL
    # Code scanning on a private or internal repository needs GitHub Advanced
    # Security. Skip until the repo is public: a skipped job still posts a
    # check-run, which counts as passing for a required status check.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # dist/ is a generated bundle of src/ plus third-party code; scanning
          # it would only duplicate (and misattribute) findings from src/.
          config: |
            paths-ignore:
              - dist
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
