# Review every pull request with a Blocks agent, then chain a second session
# that reads the first session's transcript and fixes what it rated highly.
#
# Copy this into .github/workflows/ in your own repository and set a
# BLOCKS_API_KEY secret.
name: PR Review + Autofix

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The action never uses GITHUB_TOKEN; the agent acts through your Blocks
# GitHub integration, so nothing beyond read is needed here.
permissions:
  contents: read

jobs:
  run_pull_request:
    name: Review
    runs-on: ubuntu-latest
    # Step outputs are step-scoped; they have to be re-exported at job level
    # before another job can read them through `needs`.
    outputs:
      session_id: ${{ steps.review.outputs.session_id }}
      status: ${{ steps.review.outputs.status }}
    steps:
      - id: review
        uses: BlocksOrg/blocks-ci-sessions@v1
        with:
          blocks_api_key: ${{ secrets.BLOCKS_API_KEY }}
          agent: claude
          timeout_minutes: 30
          prompt: |
            Review pull request ${{ github.event.pull_request.html_url }}.
            Leave inline comments, and give each finding a severity rating out of 10.

  autofix:
    name: Autofix
    needs: run_pull_request
    runs-on: ubuntu-latest
    steps:
      - id: fix
        uses: BlocksOrg/blocks-ci-sessions@v1
        with:
          blocks_api_key: ${{ secrets.BLOCKS_API_KEY }}
          agent: claude
          timeout_minutes: 30
          prompt: |
            A PR review has run on the PR ${{ github.event.pull_request.html_url }} associated with
            the session ${{ needs.run_pull_request.outputs.session_id }}.
            Refer to the commented issues and address them.

      # Outputs come from the agent, so pass them through env rather than
      # interpolating ${{ }} straight into the shell.
      - name: Report
        env:
          SESSION_URL: ${{ steps.fix.outputs.session_html_url }}
          PULL_REQUESTS: ${{ steps.fix.outputs.pull_requests }}
        run: |
          echo "Autofix session: $SESSION_URL"
          echo "Pull requests touched: $PULL_REQUESTS"
